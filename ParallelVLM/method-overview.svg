<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#fffaf2"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#34495e"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172333}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#586778}.label{font-size:16px;font-weight:700}.small{font-size:12px;fill:#586778}.box{fill:#fff;stroke:#cbd9e6;stroke-width:1.8;rx:12}.blue{fill:#e7f3ff}.green{fill:#e7faef}.yellow{fill:#fff2c7}.line{stroke:#34495e;stroke-width:3;fill:none;marker-end:url(#arrow)}.lane{stroke:#9eb0c4;stroke-width:2}.chip{fill:#fff;stroke:#9eb0c4;stroke-width:1.5;rx:7}</style></defs>
  <rect width="980" height="500" fill="url(#bg)"/>
  <text x="48" y="48" class="title">ParallelVLM: hide draft cost in long-video speculative decoding</text>
  <text x="48" y="74" class="sub">Parallel prefilling and decoding remove mutual waiting; UV-Prune keeps draft and target aligned.</text>
  <text x="70" y="126" class="label">Stage I: Parallel Prefilling</text>
  <line x1="70" y1="166" x2="880" y2="166" class="lane"/>
  <rect x="105" y="138" width="255" height="56" class="box blue"/><text x="128" y="171" class="small">Target prefill: full video tokens</text>
  <rect x="410" y="138" width="250" height="56" class="box green"/><text x="432" y="171" class="small">UV-Prune: target-guided token selection</text>
  <rect x="700" y="138" width="150" height="56" class="box yellow"/><text x="727" y="171" class="small">startup drafts</text>
  <path d="M360 166H410" class="line"/><path d="M660 166H700" class="line"/>
  <text x="70" y="260" class="label">Stage II: Parallel Decoding</text>
  <rect x="100" y="298" width="220" height="78" class="box green"/><text x="126" y="328" class="label">Draft process</text><text x="126" y="354" class="small">pruned video context, larger window</text>
  <rect x="430" y="298" width="220" height="78" class="box blue"/><text x="456" y="328" class="label">Target process</text><text x="456" y="354" class="small">full-context verification</text>
  <rect x="760" y="298" width="130" height="78" class="box yellow"/><text x="787" y="328" class="label">Pre-rollback</text><text x="787" y="354" class="small">restart if reject</text>
  <path d="M320 337H430" class="line"/><path d="M650 337H760" class="line"/>
  <text x="118" y="425" class="small">UV-Prune uses layerwise vision-text similarity variation, avoiding attention-sink positional bias.</text>
</svg>
