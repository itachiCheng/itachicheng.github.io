<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f4fff8"/>
    </linearGradient>
    <linearGradient id="speed" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#22b8f0"/>
      <stop offset="1" stop-color="#1685d8"/>
    </linearGradient>
    <linearGradient id="accept" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#45d69a"/>
      <stop offset="1" stop-color="#12a974"/>
    </linearGradient>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172333}
      .title{font-size:24px;font-weight:700}
      .sub{font-size:14px;fill:#586778}
      .label{font-size:14px;font-weight:700}
      .small{font-size:12px;fill:#586778}
      .value{font-size:18px;font-weight:700}
      .axis{stroke:#6f8193;stroke-width:2}
      .grid{stroke:#d7e1ea;stroke-width:1}
      .card{fill:#fff;stroke:#d4e0ea;stroke-width:1.5;rx:12}
    </style>
  </defs>
  <rect width="980" height="500" fill="url(#bg)"/>
  <text x="48" y="48" class="title">Qwen3-8B greedy decoding</text>
  <text x="48" y="74" class="sub">Average over math, code, and chat benchmarks. Blue is speedup; green is accepted tokens per cycle.</text>
  <circle cx="674" cy="52" r="7" fill="#1685d8"/>
  <text x="690" y="57" class="label">speedup</text>
  <circle cx="770" cy="52" r="7" fill="#12a974"/>
  <text x="786" y="57" class="label">acceptance length</text>

  <line x1="84" y1="374" x2="904" y2="374" class="axis"/>
  <line x1="84" y1="374" x2="84" y2="124" class="axis"/>
  <line x1="84" y1="324" x2="904" y2="324" class="grid"/>
  <line x1="84" y1="274" x2="904" y2="274" class="grid"/>
  <line x1="84" y1="224" x2="904" y2="224" class="grid"/>
  <line x1="84" y1="174" x2="904" y2="174" class="grid"/>
  <text x="54" y="378" class="small">0</text>
  <text x="48" y="278" class="small">4</text>
  <text x="48" y="178" class="small">8</text>

  <rect x="150" y="312" width="44" height="62" fill="#9aa8ba" rx="6"/>
  <rect x="205" y="280" width="44" height="94" fill="#6f7f93" rx="6"/>
  <text x="142" y="302" class="small">1.97x</text>
  <text x="205" y="270" class="small">2.97</text>

  <rect x="430" y="228" width="44" height="146" fill="url(#speed)" rx="6"/>
  <rect x="485" y="185" width="44" height="189" fill="#24c7a6" rx="6"/>
  <text x="422" y="218" class="small">4.66x</text>
  <text x="486" y="175" class="small">6.06</text>

  <rect x="710" y="202" width="44" height="172" fill="url(#speed)" rx="6"/>
  <rect x="765" y="150" width="44" height="224" fill="url(#accept)" rx="6"/>
  <text x="702" y="192" class="small">5.49x</text>
  <text x="767" y="140" class="small">7.17</text>

  <rect x="118" y="398" width="164" height="64" class="card"/>
  <text x="154" y="424" class="label">EAGLE-3</text>
  <text x="156" y="447" class="small">tree size 16</text>
  <rect x="398" y="398" width="164" height="64" class="card"/>
  <text x="452" y="424" class="label">DFlash</text>
  <text x="437" y="447" class="small">block size 16</text>
  <rect x="678" y="398" width="164" height="64" class="card"/>
  <text x="729" y="424" class="label">Domino</text>
  <text x="717" y="447" class="small">block size 16</text>
</svg>
