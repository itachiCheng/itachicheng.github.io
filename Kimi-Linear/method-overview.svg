<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Kimi Linear method overview</title>
  <desc id="desc">A hybrid stack interleaving Kimi Delta Attention layers and MLA layers, with MoE feed-forward blocks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 13px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .kda { fill: #dbeafe; stroke: #2563eb; }
      .mla { fill: #fef3c7; stroke: #ca8a04; }
      .moe { fill: #dcfce7; stroke: #16a34a; }
      .state { fill: #f1f5f9; stroke: #64748b; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="24" y="26" width="872" height="308" class="box"/>
  <text x="460" y="62" text-anchor="middle" class="label">Kimi Linear = KDA-heavy hybrid attention</text>
  <text x="460" y="86" text-anchor="middle" class="small">Repeat 3 KDA token-mixing layers, then 1 full MLA layer for global retrieval</text>

  <rect x="62" y="146" width="100" height="64" class="state"/>
  <text x="112" y="173" text-anchor="middle" class="label">Input</text>
  <text x="112" y="194" text-anchor="middle" class="tiny">token states</text>

  <rect x="210" y="126" width="104" height="104" class="kda"/>
  <text x="262" y="158" text-anchor="middle" class="label">KDA</text>
  <text x="262" y="181" text-anchor="middle" class="small">fine-grained</text>
  <text x="262" y="201" text-anchor="middle" class="small">linear memory</text>

  <rect x="344" y="126" width="104" height="104" class="kda"/>
  <text x="396" y="158" text-anchor="middle" class="label">KDA</text>
  <text x="396" y="181" text-anchor="middle" class="small">constant-size</text>
  <text x="396" y="201" text-anchor="middle" class="small">state</text>

  <rect x="478" y="126" width="104" height="104" class="kda"/>
  <text x="530" y="158" text-anchor="middle" class="label">KDA</text>
  <text x="530" y="181" text-anchor="middle" class="small">fast decode</text>
  <text x="530" y="201" text-anchor="middle" class="small">low KV cache</text>

  <rect x="612" y="126" width="104" height="104" class="mla"/>
  <text x="664" y="158" text-anchor="middle" class="label">MLA</text>
  <text x="664" y="181" text-anchor="middle" class="small">full global</text>
  <text x="664" y="201" text-anchor="middle" class="small">attention</text>

  <rect x="758" y="146" width="100" height="64" class="state"/>
  <text x="808" y="173" text-anchor="middle" class="label">Output</text>
  <text x="808" y="194" text-anchor="middle" class="tiny">next states</text>

  <path d="M162 178 H202" class="line"/>
  <path d="M314 178 H336" class="line"/>
  <path d="M448 178 H470" class="line"/>
  <path d="M582 178 H604" class="line"/>
  <path d="M716 178 H750" class="line"/>

  <rect x="245" y="260" width="430" height="42" class="moe"/>
  <text x="460" y="286" text-anchor="middle" class="small">Each token-mixing layer is followed by MoE channel mixing</text>

  <path d="M262 230 V252" class="line"/>
  <path d="M396 230 V252" class="line"/>
  <path d="M530 230 V252" class="line"/>
  <path d="M664 230 V252" class="line"/>
</svg>
