<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f3f8ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34485e"/>
    </marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172333}
      .title{font-size:24px;font-weight:700}
      .sub{font-size:14px;fill:#586778}
      .label{font-size:16px;font-weight:700}
      .small{font-size:12px;fill:#586778}
      .box{rx:12;stroke-width:1.8;stroke:#9caebe}
      .line{stroke:#34485e;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .axis{stroke:#5c6f82;stroke-width:2}
      .curve{fill:none;stroke-width:4;stroke-linecap:round}
      .card{fill:#fff;stroke:#cbd9e6;stroke-width:1.5;rx:12}
    </style>
  </defs>
  <rect width="980" height="520" fill="url(#bg)"/>
  <text x="48" y="48" class="title">Training Domino head</text>
  <text x="48" y="74" class="sub">Teacher forcing trains the causal state on accepted prefixes; base anchoring keeps the parallel backbone strong.</text>

  <rect x="62" y="120" width="235" height="92" class="box" fill="#e8f2ff"/>
  <text x="88" y="154" class="label">Teacher forcing</text>
  <text x="88" y="180" class="small">GRU reads ground-truth</text>
  <text x="88" y="198" class="small">previous draft tokens</text>
  <path d="M297 166 H352" class="line"/>

  <rect x="352" y="120" width="255" height="92" class="box" fill="#e8faef"/>
  <text x="378" y="154" class="label">Causal state</text>
  <text x="378" y="180" class="small">represents the regime where</text>
  <text x="378" y="198" class="small">previous tokens are accepted</text>
  <path d="M607 166 H662" class="line"/>

  <rect x="662" y="120" width="250" height="92" class="box" fill="#fff0c5"/>
  <text x="688" y="154" class="label">Corrected logits</text>
  <text x="688" y="180" class="small">Lfinal = Lbase + delta L</text>
  <text x="688" y="198" class="small">cheap logit residual</text>

  <rect x="62" y="260" width="422" height="202" class="card"/>
  <text x="92" y="294" class="label">Base-anchored curriculum</text>
  <text x="92" y="318" class="small">L = (1 - lambda) Lfinal + lambda Lbase</text>
  <line x1="104" y1="422" x2="438" y2="422" class="axis"/>
  <line x1="104" y1="422" x2="104" y2="342" class="axis"/>
  <path d="M116 350 C200 366 282 392 424 414" class="curve" stroke="#2f80ed"/>
  <path d="M116 414 C204 398 288 368 424 344" class="curve" stroke="#27ae60"/>
  <text x="132" y="356" class="small">lambda high: train base logits</text>
  <text x="292" y="352" class="small">final loss takes over</text>
  <text x="284" y="446" class="small">training step</text>

  <rect x="526" y="260" width="386" height="202" class="card"/>
  <text x="556" y="294" class="label">Failure mode and fix</text>
  <text x="556" y="326" class="small">Problem: clean prefixes can let the correction head</text>
  <text x="556" y="346" class="small">shortcut a weak parallel backbone.</text>
  <text x="556" y="386" class="small">Fix: first anchor learning on Lbase, then gradually</text>
  <text x="556" y="406" class="small">shift the objective to corrected final logits.</text>
  <circle cx="556" cy="438" r="5" fill="#27ae60"/>
  <text x="570" y="442" class="small">Result: stronger backbone plus useful causal residual.</text>
</svg>
