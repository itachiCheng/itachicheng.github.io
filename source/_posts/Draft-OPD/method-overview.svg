<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7fbff"/><stop offset="1" stop-color="#f5fff8"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#34495e"/></marker>
    <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172333}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#586778}.label{font-size:16px;font-weight:700}.small{font-size:12px;fill:#586778}.box{fill:#fff;stroke:#cbd9e6;stroke-width:1.8;rx:12}.blue{fill:#e7f3ff}.green{fill:#e7faef}.yellow{fill:#fff2c7}.red{fill:#ffe8e4}.line{stroke:#34495e;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#8093a8;stroke-width:2;stroke-dasharray:6 6;fill:none}</style>
  </defs>
  <rect width="980" height="500" fill="url(#bg)"/>
  <text x="48" y="48" class="title">Draft-OPD: train on verification-time errors</text>
  <text x="48" y="74" class="sub">Stable target-assisted rollout keeps samples usable; replay preserves draft-induced accepted and rejected proposals.</text>
  <rect x="70" y="125" width="190" height="92" class="box blue"/>
  <text x="96" y="159" class="label">Prompt + prefix</text><text x="96" y="185" class="small">current verified state</text>
  <path d="M260 171H330" class="line"/>
  <rect x="330" y="125" width="220" height="92" class="box green"/>
  <text x="358" y="159" class="label">Speculative rollout</text><text x="358" y="185" class="small">draft proposes, target verifies</text>
  <path d="M550 171H620" class="line"/>
  <rect x="620" y="125" width="240" height="92" class="box yellow"/>
  <text x="648" y="159" class="label">Record anchors</text><text x="648" y="185" class="small">block starts and failure positions</text>
  <path d="M740 217V288" class="line"/>
  <rect x="560" y="288" width="320" height="100" class="box red"/>
  <text x="588" y="323" class="label">Replay from anchors</text><text x="588" y="349" class="small">compute q draft log-probs and p target log-probs</text><text x="588" y="371" class="small">on accepted and rejected draft tokens</text>
  <path d="M560 338H460" class="line"/>
  <rect x="120" y="288" width="340" height="100" class="box"/>
  <text x="148" y="323" class="label">Acceptance-aware distillation</text>
  <text x="148" y="349" class="small">accepted: forward KL reinforces agreement</text>
  <text x="148" y="371" class="small">rejected: reverse KL corrects draft failure modes</text>
  <path d="M164 217V288" class="dash"/>
  <text x="104" y="430" class="label">Key point</text>
  <text x="104" y="456" class="small">Do not train only on target trajectories. Train the drafter where speculative verification actually exposes its errors.</text>
</svg>
