  <line x1="86" y1="282" x2="602" y2="282" class="grid"/><line x1="86" y1="232" x2="602" y2="232" class="grid"/><line x1="86" y1="182" x2="602" y2="182" class="grid"/>
  <rect x="142" y="156" width="58" height="176" class="bar1" rx="7"/><text x="136" y="146" class="small">4.06x</text><text x="128" y="360" class="small">EAGLE-3</text>
  <rect x="304" y="142" width="58" height="190" class="bar2" rx="7"/><text x="301" y="132" class="small">4.34x</text><text x="311" y="360" class="small">DFlash</text>
  <rect x="466" y="120" width="58" height="212" class="bar3" rx="7"/><text x="463" y="110" class="small">4.89x</text><text x="462" y="360" class="small">Draft-OPD</text>
