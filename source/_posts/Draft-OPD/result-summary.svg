<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430">
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f7fff6"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172333}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#586778}.label{font-size:15px;font-weight:700}.small{font-size:12px;fill:#586778}.value{font-size:28px;font-weight:700}.card{fill:#fff;stroke:#d3dfeb;stroke-width:1.6;rx:14}.bar1{fill:#9fb2c7}.bar2{fill:#31a8e8}.bar3{fill:#24c083}.axis{stroke:#71869b;stroke-width:2}.grid{stroke:#dde7ef;stroke-width:1}</style></defs>
  <rect width="980" height="430" fill="url(#bg)"/>
  <text x="48" y="50" class="title">Draft-OPD results on Qwen3</text>
  <text x="48" y="76" class="sub">Matched training FLOPs. Thinking mode enabled, temperature 0, average across seven benchmarks.</text>
